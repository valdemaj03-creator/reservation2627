spring.application.name=reservation2627
spring.application.frontend-url=http://localhost:8080

# Chargement des identifiants depuis le fichier .env (non versionné)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3307/reservations?autoReconnect=true&useSSL=false&serverTimezone=Europe/Brussels&useLegacyDatetimeCode=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.baseline-on-migrate=true

# Enable use of hidden input to override HTML method in form (put & delete)
spring.mvc.hiddenmethod.filter.enabled=true

# Email configuration (MailTrap)
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=trueter.enabled=true